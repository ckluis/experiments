<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="shellOS: a single-window desktop shell with themes, items, reader and terminal panes, where every pixel of the 8 by 16 font is rasterized in pure Bend, with only a thin C seam for files, sockets, TLS, PTY and the window">
