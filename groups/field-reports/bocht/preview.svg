<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="bocht — a whole backend of HTTP, auth, rate limits, WAL storage, REST and MCP compiled into one 1.70 MB binary, with every claim bound to a re-derivable result">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0" stop-color="#6f9fd6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6f9fd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">One program, one binary.</text>
<rect x="40" y="92" width="250" height="248" rx="14" fill="#6f9fd6" fill-opacity=".08" stroke="#6f9fd6" stroke-width="1.5"/>
<text x="58" y="118" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#6f9fd6" fill-opacity="1" text-anchor="start">ONE BINARY</text>
<text x="272" y="118" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".06em" fill="#6f9fd6" fill-opacity="1" text-anchor="end">1.70 MB</text>
<rect x="58" y="134" width="214" height="38" rx="8" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="74" y="158" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.85" text-anchor="start">HTTP</text>
<rect x="58" y="184" width="214" height="38" rx="8" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="74" y="208" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.85" text-anchor="start">AUTH · RATE LIMITS</text>
<rect x="58" y="234" width="214" height="38" rx="8" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="74" y="258" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.85" text-anchor="start">WAL STORAGE</text>
<rect x="58" y="284" width="214" height="38" rx="8" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="74" y="308" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.85" text-anchor="start">REST + MCP</text>
<text x="340" y="118" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start">NO CLAIM WITHOUT A RESULT</text>
<rect x="340" y="134" width="260" height="52" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="358" y="156" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start">CLAIM</text>
<text x="358" y="175" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing=".02em" fill="#efe6d6" fill-opacity="0.7" text-anchor="start">“it handles X”</text>
<path d="M470 186v20" stroke="#efe6d6" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
<rect x="340" y="206" width="260" height="52" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="358" y="228" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start">PROBE</text>
<text x="358" y="247" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing=".02em" fill="#efe6d6" fill-opacity="0.9" text-anchor="start">PASS=27 FAIL=0</text>
<path d="M470 258v20" stroke="#efe6d6" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
<rect x="340" y="278" width="260" height="52" rx="10" fill="#6f9fd6" fill-opacity=".1" stroke="#6f9fd6" stroke-width="1.5"/>
<text x="358" y="300" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#6f9fd6" fill-opacity="1" text-anchor="start">SHA-256</text>
<text x="358" y="319" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing=".02em" fill="#efe6d6" fill-opacity="0.9" text-anchor="start">BOUND TO BINARY</text>
</svg>
