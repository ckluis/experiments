<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="bochtCMS: time to save one blog post versus post size. The curve before the one-function fix climbs to 126 seconds at 48 KB while the fixed curve stays flat at 0.1 seconds, and all 43 tests pass either way">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0" stop-color="#6f9fd6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6f9fd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">Green tests, bent curve.</text>
<rect x="40" y="92" width="560" height="268" rx="14" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="64" y="120" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start">TIME TO SAVE ONE POST</text>
<text x="320" y="340" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.45" text-anchor="middle">POST SIZE →</text>
<g stroke="#efe6d6" stroke-opacity=".12" stroke-width="1"><line x1="64" y1="170" x2="576" y2="170"/><line x1="64" y1="230" x2="576" y2="230"/><line x1="64" y1="290" x2="576" y2="290"/></g>
<line x1="64" y1="320" x2="576" y2="320" stroke="#efe6d6" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
<text x="64" y="340" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.45" text-anchor="start">0</text>
<text x="576" y="340" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".08em" fill="#efe6d6" fill-opacity="0.45" text-anchor="end">48 KB</text>
<path d="M64 318 Q 420 316 560 142" fill="none" stroke="#6f9fd6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="560" cy="142" r="5" fill="#6f9fd6"/>
<text x="540" y="132" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#6f9fd6" fill-opacity="1" text-anchor="end">BEFORE · 126.2 s</text>
<path d="M64 320 L560 320" stroke="#7fc49a" stroke-width="2.5" stroke-linecap="round"/><circle cx="560" cy="320" r="5" fill="#7fc49a"/>
<text x="540" y="308" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#7fc49a" fill-opacity="1" text-anchor="end">AFTER · 0.105 s</text>
<rect x="88" y="136" width="172" height="40" rx="8" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<path d="M104 156 l5 5 l9 -11" fill="none" stroke="#7fc49a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="160" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing=".06em" fill="#efe6d6" fill-opacity="1" text-anchor="start">43/43 TESTS PASS</text>
</svg>
