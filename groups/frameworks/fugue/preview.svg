<text x="140" y="171" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0" fill="#efe6d6" fill-opacity="0.35" text-anchor="middle">grain · cart</text>
<rect x="400" y="104" width="200" height="104" rx="12" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
<text x="416" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing=".1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start">NODE B</text>
<rect x="424" y="146" width="152" height="40" rx="9" fill="#e08a5a" fill-opacity=".12" stroke="#e08a5a" stroke-width="1.5"/>
<text x="500" y="171" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing="0" fill="#e08a5a" fill-opacity="1" text-anchor="middle">grain · cart</text>
