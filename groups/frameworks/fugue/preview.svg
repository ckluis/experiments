<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="fugue — a stateful grain on node A survives the node being killed: it reactivates on node B from its state in Postgres, and the user's view never drops">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0" stop-color="#e08a5a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e08a5a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
