<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="crucible-works — five tenant cards side by side, each a stack of CRM, CMS, KB and billing panes, each standing on its own labelled schema slice of one wide Postgres band, walls between the columns; a plain slab labelled cauldron beneath; one tenant carries a violet RBAC key and its own scoped agent, while a platform agent spans every column from above; a faint stamp reads archived, March 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a140c"/><stop offset="1" stop-color="#0e0a05"/>
    </linearGradient>
    <radialGradient id="glowP" cx="16%" cy="8%" r="60%">
      <stop offset="0" stop-color="#6b4ec2" stop-opacity=".3"/><stop offset="1" stop-color="#6b4ec2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="92%" cy="100%" r="65%">
      <stop offset="0" stop-color="#c56a3a" stop-opacity=".18"/><stop offset="1" stop-color="#c56a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e3a"/><stop offset="1" stop-color="#171a22"/>
    </linearGradient>
    <linearGradient id="slabTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171410"/><stop offset="1" stop-color="#100d09"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a22"/><stop offset="1" stop-color="#121117"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#f2e9da" fill-opacity=".08"/>
    </pattern>
    <pattern id="tests" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.7" fill="#6ee0a0" fill-opacity=".42"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="wide" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>

    <!-- one tenant card: panes for CRM · CMS · KB · billing -->
    <g id="stack">
      <rect x="0" y="0" width="156" height="112" rx="8" fill="url(#card)"/>
      <rect x="12" y="10" width="132" height="18" rx="4" opacity=".62"/>
      <rect x="12" y="36" width="132" height="18" rx="4" opacity=".44"/>
      <rect x="12" y="62" width="132" height="18" rx="4" opacity=".32"/>
      <rect x="12" y="88" width="132" height="18" rx="4" opacity=".22"/>
      <g fill="#f2e9da" fill-opacity=".5">
        <circle cx="24" cy="19" r="3.2"/><circle cx="36" cy="19" r="3.2"/><circle cx="48" cy="19" r="3.2"/>
        <rect x="20" y="42" width="58" height="2.6" rx="1.3"/><rect x="20" y="47.5" width="38" height="2.6" rx="1.3"/>
        <rect x="20" y="66" width="10" height="10" rx="1.5"/><rect x="34" y="68" width="44" height="2.6" rx="1.3"/><rect x="34" y="73.5" width="30" height="2.6" rx="1.3"/>
        <rect x="20" y="93" width="76" height="8" rx="2" fill-opacity=".18"/><rect x="20" y="93" width="46" height="8" rx="2"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="#2a3550" opacity=".2"/>
  <rect width="1200" height="760" fill="url(#glowP)"/>
  <rect width="1200" height="760" fill="url(#glowA)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>

  <!-- archived stamp -->
  <g transform="translate(62,26) rotate(-2.5)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
    <rect x="0" y="0" width="196" height="26" rx="4" fill="none" stroke="#f2e9da" stroke-opacity=".28" stroke-width="1.4"/>
    <text x="98" y="17.5" text-anchor="middle" font-size="12.5" fill="#f2e9da" fill-opacity=".5" letter-spacing="1.8">ARCHIVED · MAR 2026</text>
  </g>

  <!-- ===== platform agent: cross-tenant, spans every column from above ===== -->
  <line x1="196" y1="92" x2="1004" y2="92" stroke="#e6dcff" stroke-opacity=".5" stroke-width="1.8"/>
  <g stroke="#e6dcff" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="3 4">
    <line x1="196" y1="92" x2="196" y2="122"/><line x1="398" y1="92" x2="398" y2="122"/>
    <line x1="600" y1="92" x2="600" y2="122"/><line x1="802" y1="92" x2="802" y2="122"/><line x1="1004" y1="92" x2="1004" y2="122"/>
  </g>
  <g fill="#e6dcff" opacity=".7"><circle cx="196" cy="92" r="3"/><circle cx="1004" cy="92" r="3"/></g>
  <g transform="translate(600,62)">
    <circle r="15" fill="#0e0a05" stroke="#e6dcff" stroke-opacity=".8" stroke-width="2"/>
    <path d="M0 -8 L2.4 -2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4 -2.4 Z" fill="#e6dcff"/>
    <line x1="0" y1="15" x2="0" y2="30" stroke="#e6dcff" stroke-opacity=".5" stroke-width="1.8"/>
  </g>
  <text x="624" y="67" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#e6dcff" fill-opacity=".62" letter-spacing="1.2">platform agent · all tenants</text>

  <!-- row legend -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".38" text-anchor="end" letter-spacing=".6">
    <text x="104" y="145">crm</text><text x="104" y="171">cms</text><text x="104" y="197">kb</text><text x="104" y="223">billing</text>
  </g>

  <!-- ===== one Postgres band, sliced per tenant ===== -->
  <rect x="96" y="268" width="1008" height="52" rx="26" fill="url(#band)" stroke="#f2e9da" stroke-opacity=".16" stroke-width="1.4"/>
  <rect x="122" y="270" width="956" height="1.5" fill="#f2e9da" opacity=".12"/>
  <g>
    <rect x="110" y="272" width="172" height="44" rx="3" fill="#7d93b0" opacity=".14"/>
    <rect x="312" y="272" width="172" height="44" rx="3" fill="#7b5adc" opacity=".24"/>
    <rect x="514" y="272" width="172" height="44" rx="3" fill="#7fbf9a" opacity=".13"/>
    <rect x="716" y="272" width="172" height="44" rx="3" fill="#e6a15c" opacity=".13"/>
    <rect x="918" y="272" width="172" height="44" rx="3" fill="#9a9aa6" opacity=".12"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="#f2e9da" fill-opacity=".74" text-anchor="middle" letter-spacing=".6">
    <text x="196" y="299">co_acme</text><text x="398" y="299" fill="#e6dcff" fill-opacity=".95">co_zeta</text>
    <text x="600" y="299">co_nord</text><text x="802" y="299">co_ivy</text><text x="1004" y="299">co_oak</text>
  </g>
  <text x="110" y="337" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#f2e9da" fill-opacity=".4" letter-spacing="1.4">ONE POSTGRES · A SCHEMA PER TENANT · SET search_path</text>

  <!-- ===== feet: each card stands on its own slice ===== -->
  <rect x="184" y="234" width="24" height="36" fill="#7d93b0" opacity=".3"/>
  <rect x="588" y="234" width="24" height="36" fill="#7fbf9a" opacity=".3"/>
  <rect x="790" y="234" width="24" height="36" fill="#e6a15c" opacity=".3"/>
  <rect x="992" y="234" width="24" height="36" fill="#9a9aa6" opacity=".3"/>

  <!-- ===== tenant cards ===== -->
  <g transform="translate(118,122)" fill="#7d93b0"><use href="#stack"/><rect width="156" height="112" rx="8" fill="none" stroke="#7d93b0" stroke-opacity=".5" stroke-width="1.5"/></g>
  <g transform="translate(522,122)" fill="#7fbf9a"><use href="#stack"/><rect width="156" height="112" rx="8" fill="none" stroke="#7fbf9a" stroke-opacity=".5" stroke-width="1.5"/></g>
  <g transform="translate(724,122)" fill="#e6a15c"><use href="#stack"/><rect width="156" height="112" rx="8" fill="none" stroke="#e6a15c" stroke-opacity=".5" stroke-width="1.5"/></g>
  <g transform="translate(926,122)" fill="#9a9aa6"><use href="#stack"/><rect width="156" height="112" rx="8" fill="none" stroke="#9a9aa6" stroke-opacity=".5" stroke-width="1.5"/></g>

  <!-- the highlighted tenant: RBAC key, and its own scoped agent -->
  <rect x="320" y="122" width="156" height="112" rx="8" fill="#7b5adc" opacity=".45" filter="url(#wide)"/>
  <g transform="translate(320,122)" fill="#7b5adc"><use href="#stack"/><rect width="156" height="112" rx="8" fill="none" stroke="#e6dcff" stroke-opacity=".85" stroke-width="2"/></g>
  <g transform="translate(470,128)">
    <circle r="16" fill="#0e0a05" stroke="#7b5adc" stroke-width="2.4"/>
    <circle cx="-4.5" cy="-2" r="4" fill="none" stroke="#e6dcff" stroke-width="2.2"/>
    <path d="M-1.5 1 L7 9.5 M4 6.5 L6.5 4 M1.5 4 L4 1.5" stroke="#e6dcff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <line x1="398" y1="234" x2="398" y2="268" stroke="#7b5adc" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(398,251)">
    <circle r="11" fill="#7b5adc" stroke="#e6dcff" stroke-width="2"/>
    <path d="M0 -5.5 L1.6 -1.6 L5.5 0 L1.6 1.6 L0 5.5 L-1.6 1.6 L-5.5 0 L-1.6 -1.6 Z" fill="#e6dcff"/>
  </g>
  <text x="414" y="255" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#e6dcff" fill-opacity=".8" letter-spacing=".8">tenant agent</text>

  <!-- ===== walls: isolation between tenants ===== -->
  <g stroke="#f2e9da" stroke-opacity=".16" stroke-width="8" stroke-linecap="round" filter="url(#soft)">
    <line x1="297" y1="108" x2="297" y2="320"/><line x1="499" y1="108" x2="499" y2="320"/>
    <line x1="701" y1="108" x2="701" y2="320"/><line x1="903" y1="108" x2="903" y2="320"/>
  </g>
  <g stroke="#f2e9da" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
    <line x1="297" y1="108" x2="297" y2="320"/><line x1="499" y1="108" x2="499" y2="320"/>
    <line x1="701" y1="108" x2="701" y2="320"/><line x1="903" y1="108" x2="903" y2="320"/>
  </g>

  <!-- ===== foundation slab: cauldron ===== -->
  <polygon points="60,346 1140,346 1160,372 40,372" fill="url(#slabTop)" stroke="#f2e9da" stroke-opacity=".16" stroke-width="1.4"/>
  <rect x="40" y="372" width="1120" height="22" rx="2" fill="#0b0906"/>
  <text x="600" y="364" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#f2e9da" fill-opacity=".48" letter-spacing="4">cauldron</text>

  <!-- ===== below the fold ===== -->
  <text x="96" y="446" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".38" letter-spacing="1.6">540 TESTS</text>
  <rect x="96" y="460" width="432" height="180" fill="url(#tests)"/>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#f2e9da" fill-opacity=".3" letter-spacing=".4">
    <text x="600" y="446">SET search_path TO co_zeta;</text>
    <text x="600" y="470">owner &gt; admin &gt; member &gt; viewer</text>
    <text x="600" y="494">CREATE TABLE co_zeta.custom_orders (…);</text>
  </g>
  <text x="1160" y="718" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="128" font-weight="600" fill="#f2e9da" fill-opacity=".08" letter-spacing="-3">crucible</text>
</svg>
