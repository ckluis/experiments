<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="cauldron — one sealed binary holding a whole web stack, HTTP, Postgres, crypto, UI engine, admin and agents, while quicklisp, FFI, C and npm stay outside struck through">
