<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="tinker — one sealed email field fans out into three faces: a mask that every query and agent sees, a key that automations use, and the plaintext value that only opens after a second person approves">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0" stop-color="#e08a5a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e08a5a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- the record: one sealed field -->
  <g transform="translate(40 116)">
    <rect width="196" height="168" rx="14" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="18" y="30" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".5">CUSTOMER</text>
    <line x1="18" y1="44" x2="178" y2="44" stroke="#efe6d6" stroke-opacity=".12" stroke-width="1"/>
    <text x="18" y="70" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#efe6d6" fill-opacity=".45">name</text>
    <rect x="70" y="60" width="92" height="12" rx="3" fill="#efe6d6" fill-opacity=".18"/>
    <text x="18" y="104" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#efe6d6" fill-opacity=".45">email</text>
    <rect x="66" y="88" width="112" height="24" rx="6" fill="#e08a5a" fill-opacity=".12" stroke="#e08a5a" stroke-width="1.5"/>
    <!-- lock -->
    <rect x="76" y="99" width="11" height="9" rx="2" fill="none" stroke="#e08a5a" stroke-width="1.5"/>
    <path d="M78.5 99v-2.5a3 3 0 0 1 6 0V99" fill="none" stroke="#e08a5a" stroke-width="1.5"/>
    <text x="94" y="104" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" letter-spacing=".06em" fill="#e08a5a">SEALED</text>
    <text x="18" y="138" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#efe6d6" fill-opacity=".45">phone</text>
    <rect x="66" y="128" width="112" height="14" rx="3" fill="none" stroke="#e08a5a" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- three faces -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M244 216 C 300 216, 300 104, 352 104" stroke="#efe6d6" stroke-opacity=".35"/>
    <path d="M244 216 C 300 216, 300 200, 352 200" stroke="#efe6d6" stroke-opacity=".35"/>
    <path d="M244 216 C 300 216, 300 296, 352 296" stroke="#e08a5a"/>
  </g>
  <circle cx="244" cy="216" r="4" fill="#e08a5a"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <!-- mask -->
    <rect x="352" y="80" width="248" height="48" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
    <text x="368" y="100" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity=".5">MASK · EVERY QUERY + AGENT</text>
    <text x="368" y="119" font-size="14" letter-spacing=".2em" fill="#efe6d6">••••••</text>
    <!-- key -->
    <rect x="352" y="176" width="248" height="48" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
    <text x="368" y="196" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity=".5">KEY · AUTOMATIONS</text>
    <text x="368" y="215" font-size="13" fill="#efe6d6" fill-opacity=".85">pk_3f9a0c71…b84d</text>
    <!-- value, behind four eyes -->
    <rect x="352" y="272" width="248" height="48" rx="10" fill="#e08a5a" fill-opacity=".1" stroke="#e08a5a" stroke-width="1.5"/>
    <text x="368" y="292" font-size="10" letter-spacing=".1em" fill="#e08a5a">VALUE · ONE PERSON, ONE TIME</text>
    <text x="368" y="311" font-size="13" fill="#efe6d6">ada@analytical.engine</text>
  </g>
  <!-- two approvers -->
  <g transform="translate(532 336)" fill="none" stroke="#e08a5a" stroke-width="1.5">
    <circle cx="10" cy="8" r="5"/><path d="M1 26c0-6 4-10 9-10s9 4 9 10"/>
    <circle cx="40" cy="8" r="5"/><path d="M31 26c0-6 4-10 9-10s9 4 9 10"/>
  </g>
  <text x="520" y="356" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity=".45">SECOND PERSON APPROVES</text>

  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">One field, three faces.</text>
</svg>
