<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Room-page requests per second in one session of Basecamp's harness: Rails 4,944, Rust 49,902, C 77,135 and onCrack 169,088">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#efe6d6" opacity=".06"/></pattern>
    <radialGradient id="glow" cx="90%" cy="12%" r="70%"><stop offset="0" stop-color="#5cc4dd" stop-opacity=".2"/><stop offset="1" stop-color="#5cc4dd" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <text x="44" y="64" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="28" fill="#efe6d6">Same pixels.</text>
  <text x="44" y="96" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="28" fill="#5cc4dd">No speed limit.</text>
  <text x="44" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".08em" fill="#efe6d6" opacity=".45">ROOM PAGE · REQ/S · 16 CLIENTS · SAME SESSION</text>
  <text x="44" y="185" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing=".08em" fill="#efe6d6" opacity="0.7">RAILS</text>
  <rect x="150" y="170" width="10.5" height="22" rx="6" fill="#efe6d6" opacity=".35"/>
  <text x="170.5" y="185" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#efe6d6" opacity="0.7">4,944</text>
  <text x="44" y="227" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing=".08em" fill="#efe6d6" opacity="0.7">RUST</text>
  <rect x="150" y="212" width="106.2" height="22" rx="6" fill="#efe6d6" opacity=".35"/>
  <text x="266.2" y="227" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#efe6d6" opacity="0.7">49,902</text>
  <text x="44" y="269" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing=".08em" fill="#efe6d6" opacity="0.7">C</text>
  <rect x="150" y="254" width="164.2" height="22" rx="6" fill="#efe6d6" opacity=".35"/>
  <text x="324.2" y="269" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#efe6d6" opacity="0.7">77,135</text>
  <text x="44" y="311" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" letter-spacing=".08em" fill="#5cc4dd" opacity="1">ONCRACK</text>
  <rect x="150" y="296" width="360.0" height="22" rx="6" fill="#5cc4dd" opacity="1"/>
  <text x="520.0" y="311" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#5cc4dd" opacity="1">169,088</text>
  <text x="44" y="362" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing=".06em" fill="#efe6d6" opacity=".45">3.4× RUST · 2.2× C · 34× RAILS · 944/944 SCREENS EQUAL</text>
</svg>
