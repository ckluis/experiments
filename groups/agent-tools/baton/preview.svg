<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="baton — a six-rung ladder of model and effort on the left, its rungs extended as cost lanes; a run graph of nodes sits on the lanes, most on the two cheapest rungs, one glowing violet as it escalates a single rung, one parked as unsettleable, and the top rung locked behind a one-slide brief to the operator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a140c"/><stop offset="1" stop-color="#0e0a05"/>
    </linearGradient>
    <radialGradient id="glowP" cx="16%" cy="8%" r="60%">
      <stop offset="0" stop-color="#6b4ec2" stop-opacity=".34"/><stop offset="1" stop-color="#6b4ec2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="92%" cy="100%" r="65%">
      <stop offset="0" stop-color="#e6a15c" stop-opacity=".26"/><stop offset="1" stop-color="#e6a15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railFade" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="440">
      <stop offset="0" stop-color="#f2e9da" stop-opacity=".3"/><stop offset=".72" stop-color="#f2e9da" stop-opacity=".26"/><stop offset="1" stop-color="#f2e9da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laneFade" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="1050" y2="0">
      <stop offset="0" stop-color="#f2e9da" stop-opacity=".2"/><stop offset=".88" stop-color="#f2e9da" stop-opacity=".16"/><stop offset="1" stop-color="#f2e9da" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#f2e9da" fill-opacity=".09"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="wide" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#f2e9da" fill-opacity=".6"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#c56a3a" fill-opacity=".95"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e6dcff"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#e6dcff" fill-opacity=".75"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#glowP)"/>
  <rect width="1200" height="760" fill="url(#glowA)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>

  <!-- ===== rung bands: the default (rung 1) and the gated top (rung 5) ===== -->
  <rect x="80" y="264" width="970" height="44" rx="4" fill="#e6dcff" opacity=".07"/>
  <rect x="80" y="56" width="970" height="44" rx="4" fill="#c56a3a" opacity=".08"/>

  <!-- ===== lanes — each rung extended across the run ===== -->
  <g stroke="url(#laneFade)" stroke-width="1.6">
    <line x1="256" y1="338" x2="1050" y2="338"/>
    <line x1="256" y1="286" x2="1050" y2="286"/>
    <line x1="256" y1="234" x2="1050" y2="234"/>
    <line x1="256" y1="182" x2="1050" y2="182"/>
    <line x1="256" y1="130" x2="1050" y2="130"/>
  </g>
  <!-- the gated lane: dashed ember, runs into the brief -->
  <line x1="256" y1="78" x2="1050" y2="78" stroke="#c56a3a" stroke-opacity=".65" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="274" y="69" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#c56a3a" fill-opacity=".9" letter-spacing="1.6">ASK BEFORE YOU SPEND</text>

  <!-- ===== the ladder ===== -->
  <g stroke="url(#railFade)" stroke-width="3.5" stroke-linecap="round">
    <line x1="88" y1="52" x2="88" y2="440"/>
    <line x1="248" y1="52" x2="248" y2="440"/>
  </g>
  <rect x="88" y="335" width="160" height="6" rx="3" fill="#e6dcff" opacity=".32"/>
  <rect x="88" y="282" width="160" height="8" rx="4" fill="#e6dcff" opacity=".95"/>
  <rect x="88" y="231" width="160" height="6" rx="3" fill="#e6dcff" opacity=".58"/>
  <rect x="88" y="179" width="160" height="6" rx="3" fill="#e6dcff" opacity=".46"/>
  <rect x="88" y="127" width="160" height="6" rx="3" fill="#d8a54a" opacity=".82"/>
  <rect x="88" y="75" width="160" height="6" rx="3" fill="#c56a3a"/>
  <rect x="88" y="279" width="160" height="14" rx="7" fill="#e6dcff" opacity=".4" filter="url(#soft)"/>

  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#f2e9da" letter-spacing=".5">
    <text x="98" y="328" fill-opacity=".4">haiku / low</text>
    <text x="98" y="276" fill-opacity=".92">sonnet / medium</text>
    <text x="98" y="224" fill-opacity=".55">sonnet / high</text>
    <text x="98" y="172" fill-opacity=".5">opus / medium</text>
    <text x="98" y="120" fill="#d8a54a" fill-opacity=".88">opus / high</text>
    <text x="98" y="68" fill="#c56a3a" fill-opacity=".95">fable / low</text>
  </g>

  <!-- the lock on the top rung -->
  <g transform="translate(222,78)">
    <circle r="17" fill="#0e0a05" stroke="#c56a3a" stroke-width="2.2"/>
    <path d="M-5.5 -1 V-5.5 A5.5 5.5 0 0 1 5.5 -5.5 V-1" fill="none" stroke="#c56a3a" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="-8" y="-1" width="16" height="11" rx="2" fill="#c56a3a"/>
  </g>

  <!-- ===== the run graph — x is order, y is the rung it was routed to ===== -->
  <g fill="none" stroke="#f2e9da" stroke-opacity=".5" stroke-width="2.8" marker-end="url(#arrC)">
    <path d="M350 286 C 405 286, 405 338, 439 338"/>
    <path d="M350 286 C 405 286, 405 234, 439 234"/>
    <path d="M480 338 C 535 338, 535 286, 569 286"/>
    <path d="M480 234 C 535 234, 535 286, 569 286"/>
    <path d="M610 234 C 665 234, 665 182, 699 182"/>
    <path d="M610 234 C 665 234, 665 286, 699 286"/>
    <path d="M740 182 C 795 182, 795 234, 829 234"/>
    <path d="M740 286 C 795 286, 795 234, 829 234"/>
    <path d="M870 234 C 925 234, 925 130, 959 130"/>
  </g>
  <!-- edge into the parked node -->
  <path d="M870 234 L 957 234" fill="none" stroke="#c56a3a" stroke-opacity=".75" stroke-width="2.6" stroke-dasharray="6 5" marker-end="url(#arrE)"/>
  <!-- a loop edge, back one node -->
  <path d="M841 249 C 824 302, 768 320, 738 301" fill="none" stroke="#e6dcff" stroke-opacity=".6" stroke-width="2.2" stroke-dasharray="4 5" marker-end="url(#arrL)"/>

  <!-- escalation: failed on rung 1, lifted exactly one rung -->
  <circle cx="590" cy="234" r="46" fill="#7b5adc" opacity=".6" filter="url(#wide)"/>
  <line x1="590" y1="286" x2="590" y2="234" stroke="#7b5adc" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <line x1="590" y1="270" x2="590" y2="259" stroke="#e6dcff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrUp)"/>
  <circle cx="590" cy="286" r="17" fill="#0e0a05" fill-opacity=".7" stroke="#f2e9da" stroke-opacity=".4" stroke-width="2.2" stroke-dasharray="4 3"/>
  <path d="M583 279 L597 293 M597 279 L583 293" stroke="#c56a3a" stroke-width="2.8" stroke-linecap="round"/>
  <text x="608" y="264" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#e6dcff" fill-opacity=".8" letter-spacing=".5">one rung</text>

  <!-- nodes -->
  <g fill="#0e0a05" stroke="#6ee0a0" stroke-width="3.4">
    <circle cx="330" cy="286" r="18"/>
    <circle cx="460" cy="338" r="18"/>
    <circle cx="460" cy="234" r="18"/>
    <circle cx="720" cy="182" r="18"/>
  </g>
  <g fill="none" stroke="#6ee0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 286 L327 291 L338 280"/>
    <path d="M452 338 L457 343 L468 332"/>
    <path d="M452 234 L457 239 L468 228"/>
    <path d="M712 182 L717 187 L728 176"/>
  </g>
  <circle cx="590" cy="234" r="19" fill="#7b5adc" stroke="#e6dcff" stroke-width="3.2"/>
  <circle cx="590" cy="234" r="6" fill="#e6dcff"/>
  <g fill="#0e0a05" stroke="#f2e9da" stroke-opacity=".6" stroke-width="3">
    <circle cx="720" cy="286" r="18"/>
    <circle cx="850" cy="234" r="18"/>
    <circle cx="980" cy="130" r="18"/>
  </g>
  <!-- parked: unsettleable -->
  <circle cx="980" cy="234" r="18" fill="#0e0a05" fill-opacity=".6" stroke="#c56a3a" stroke-width="2.8" stroke-dasharray="5 3.5"/>
  <line x1="971" y1="234" x2="989" y2="234" stroke="#c56a3a" stroke-width="3" stroke-linecap="round"/>
  <text x="980" y="270" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#c56a3a" fill-opacity=".9" letter-spacing=".5">unsettleable</text>

  <!-- ===== the brief: one slide, three options, the first recommended ===== -->
  <g transform="translate(1050,38)">
    <rect x="0" y="0" width="128" height="82" rx="7" fill="#14100a" stroke="#f2e9da" stroke-opacity=".3" stroke-width="1.6"/>
    <rect x="11" y="11" width="52" height="3.5" rx="1.75" fill="#f2e9da" opacity=".55"/>
    <rect x="11" y="24" width="106" height="13" rx="3.5" fill="#d8a54a" opacity=".92"/>
    <rect x="11" y="43" width="106" height="13" rx="3.5" fill="#f2e9da" opacity=".17"/>
    <rect x="11" y="62" width="106" height="13" rx="3.5" fill="#f2e9da" opacity=".17"/>
  </g>

  <!-- version tag -->
  <g transform="translate(88,12)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
    <rect x="0" y="0" width="54" height="24" rx="12" fill="none" stroke="#f2e9da" stroke-opacity=".28" stroke-width="1.2"/>
    <text x="27" y="16.5" text-anchor="middle" font-size="12.5" fill="#f2e9da" fill-opacity=".65" letter-spacing="1">v3.1</text>
  </g>

  <!-- ===== below the fold: verdicts per criterion, and where the run spent ===== -->
  <text x="330" y="430" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".38" letter-spacing="1.6">VERDICT PER CRITERION</text>
  <g stroke="#f2e9da" stroke-opacity=".1" stroke-width="1">
    <line x1="330" y1="450" x2="1000" y2="450"/><line x1="330" y1="478" x2="1000" y2="478"/><line x1="330" y1="506" x2="1000" y2="506"/>
  </g>
  <g fill="#6ee0a0" opacity=".85">
    <circle cx="330" cy="450" r="5.5"/><circle cx="330" cy="478" r="5.5"/><circle cx="330" cy="506" r="5.5"/>
    <circle cx="460" cy="450" r="5.5"/><circle cx="460" cy="478" r="5.5"/><circle cx="460" cy="506" r="5.5"/>
    <circle cx="720" cy="450" r="5.5"/><circle cx="720" cy="478" r="5.5"/>
  </g>
  <g fill="#7b5adc" opacity=".95">
    <circle cx="590" cy="450" r="5.5"/><circle cx="590" cy="478" r="5.5"/>
  </g>
  <g fill="none" stroke="#f2e9da" stroke-opacity=".3" stroke-width="1.5">
    <circle cx="590" cy="506" r="5.5"/><circle cx="720" cy="506" r="5.5"/>
    <circle cx="850" cy="450" r="5.5"/><circle cx="850" cy="478" r="5.5"/><circle cx="850" cy="506" r="5.5"/>
    <circle cx="980" cy="450" r="5.5"/><circle cx="980" cy="506" r="5.5"/>
  </g>
  <line x1="973" y1="478" x2="987" y2="478" stroke="#c56a3a" stroke-width="2.4" stroke-linecap="round"/>

  <text x="88" y="492" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".38" letter-spacing="1.6">WHERE IT SPENT</text>
  <line x1="88" y1="512" x2="102" y2="512" stroke="#c56a3a" stroke-opacity=".5" stroke-width="3" stroke-dasharray="2 3"/>
  <rect x="88" y="530" width="18" height="9" rx="2" fill="#d8a54a" opacity=".55"/>
  <rect x="88" y="552" width="44" height="9" rx="2" fill="#e6dcff" opacity=".3"/>
  <rect x="88" y="574" width="118" height="9" rx="2" fill="#e6dcff" opacity=".4"/>
  <rect x="88" y="596" width="160" height="9" rx="2" fill="#e6dcff" opacity=".7"/>
  <rect x="88" y="618" width="34" height="9" rx="2" fill="#e6dcff" opacity=".22"/>

  <text x="1160" y="718" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="128" font-weight="600" fill="#f2e9da" fill-opacity=".09" letter-spacing="-3">baton</text>
</svg>
