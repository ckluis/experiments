<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="baton v8 — the four parts of its status line under a Claude Code prompt: 5h at 19% resetting 14:30 EST, fable at 0%, wk at 54% resetting Mon 07:00 EST, and ctx at 5%">
  <defs>
    <radialGradient id="glow" cx="4%" cy="96%" r="70%">
      <stop offset="0" stop-color="#5fb3a1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5fb3a1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">Just a usage line.</text>

  <!-- the terminal: a prompt, then the line -->
  <rect x="40" y="88" width="560" height="248" rx="14" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
  <path d="M62 116l6 6-6 6" fill="none" stroke="#efe6d6" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="113" width="9" height="18" rx="1.5" fill="#efe6d6" fill-opacity=".35"/>
  <line x1="62" y1="148" x2="578" y2="148" stroke="#efe6d6" stroke-opacity=".12" stroke-width="1"/>

  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <!-- 5h · 19% -->
    <text x="62" y="186" font-size="13" fill="#efe6d6" fill-opacity=".55">5h</text>
    <g fill="#5fb3a1"><rect x="134" y="175" width="22" height="13" rx="3"/></g>
    <g fill="#efe6d6" fill-opacity=".12"><rect x="160" y="175" width="22" height="13" rx="3"/><rect x="186" y="175" width="22" height="13" rx="3"/><rect x="212" y="175" width="22" height="13" rx="3"/><rect x="238" y="175" width="22" height="13" rx="3"/></g>
    <text x="276" y="186" font-size="13" fill="#5fb3a1">19%</text>
    <text x="336" y="186" font-size="12" fill="#efe6d6" fill-opacity=".4">resets 14:30 EST</text>

    <!-- fable · 0% -->
    <text x="62" y="226" font-size="13" fill="#efe6d6" fill-opacity=".55">fable</text>
    <g fill="#efe6d6" fill-opacity=".12"><rect x="134" y="215" width="22" height="13" rx="3"/><rect x="160" y="215" width="22" height="13" rx="3"/><rect x="186" y="215" width="22" height="13" rx="3"/><rect x="212" y="215" width="22" height="13" rx="3"/><rect x="238" y="215" width="22" height="13" rx="3"/></g>
    <text x="276" y="226" font-size="13" fill="#5fb3a1">0%</text>

    <!-- wk · 54% -->
    <text x="62" y="266" font-size="13" fill="#efe6d6" fill-opacity=".55">wk</text>
    <g fill="#5fb3a1"><rect x="134" y="255" width="22" height="13" rx="3"/><rect x="160" y="255" width="22" height="13" rx="3"/><rect x="186" y="255" width="22" height="13" rx="3"/></g>
    <g fill="#efe6d6" fill-opacity=".12"><rect x="212" y="255" width="22" height="13" rx="3"/><rect x="238" y="255" width="22" height="13" rx="3"/></g>
    <text x="276" y="266" font-size="13" fill="#5fb3a1">54%</text>
    <text x="336" y="266" font-size="12" fill="#efe6d6" fill-opacity=".4">resets Mon 07:00 EST</text>

    <!-- ctx · 5% -->
    <text x="62" y="306" font-size="13" fill="#efe6d6" fill-opacity=".55">ctx</text>
    <g fill="#efe6d6" fill-opacity=".12"><rect x="134" y="295" width="22" height="13" rx="3"/><rect x="160" y="295" width="22" height="13" rx="3"/><rect x="186" y="295" width="22" height="13" rx="3"/><rect x="212" y="295" width="22" height="13" rx="3"/><rect x="238" y="295" width="22" height="13" rx="3"/></g>
    <text x="276" y="306" font-size="13" fill="#5fb3a1">5%</text>

    <text x="40" y="368" font-size="11" letter-spacing=".1em" fill="#efe6d6" fill-opacity=".35">SH · POWERSHELL · NO PLUGIN</text>
  </g>
</svg>
