<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="baton v7.5 — a prime that only dispatches sends goals to three sub-orchestrators, each runs its workers and hands back one line of at most 280 bytes into the prime's memory, while a guard refuses the prime's file reads and commands">
  <defs>
    <radialGradient id="glow" cx="4%" cy="96%" r="70%">
      <stop offset="0" stop-color="#5fb3a1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5fb3a1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">One thread that never fills up.</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <!-- the prime, holding its memory -->
    <rect x="40" y="96" width="190" height="164" rx="12" fill="#5fb3a1" fill-opacity=".1" stroke="#5fb3a1" stroke-width="1.5"/>
    <text x="58" y="120" font-size="12" letter-spacing=".1em" fill="#5fb3a1">PRIME</text>
    <text x="58" y="138" font-size="10" fill="#efe6d6" fill-opacity=".55">only dispatches</text>
    <path d="M58 152H212" stroke="#5fb3a1" stroke-opacity=".3" stroke-width="1"/>
    <text x="58" y="172" font-size="10" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".45">MEMORY</text>
    <rect x="58" y="186" width="154" height="5" rx="2.5" fill="#5fb3a1" fill-opacity=".8"/>
    <rect x="58" y="200" width="154" height="5" rx="2.5" fill="#efe6d6" fill-opacity=".35"/>
    <rect x="58" y="214" width="120" height="5" rx="2.5" fill="#efe6d6" fill-opacity=".28"/>
    <rect x="58" y="228" width="88" height="5" rx="2.5" fill="#efe6d6" fill-opacity=".2"/>
    <rect x="58" y="242" width="56" height="5" rx="2.5" fill="#efe6d6" fill-opacity=".12"/>

    <!-- the guard -->
    <rect x="40" y="276" width="190" height="34" rx="10" fill="#1c1812" stroke="#e07a5f" stroke-opacity=".6" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="58" y="297" font-size="10" letter-spacing=".08em" fill="#e07a5f">READ ✕  BASH ✕  EDIT ✕</text>

    <!-- sub-orchestrators -->
    <text x="280" y="86" font-size="10" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".45">SUB-ORCHESTRATORS</text>
    <rect x="280" y="96" width="160" height="44" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
    <text x="298" y="122" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".85">BOOTSTRAP</text>
    <rect x="280" y="156" width="160" height="44" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
    <text x="298" y="182" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".85">PHASE P3</text>
    <rect x="280" y="216" width="160" height="44" rx="10" fill="#1c1812" stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.5"/>
    <text x="298" y="242" font-size="11" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".85">FINAL</text>

    <!-- one line back -->
    <text x="236" y="268" font-size="10" fill="#5fb3a1">≤280 B</text>
    <text x="476" y="86" font-size="10" letter-spacing=".08em" fill="#efe6d6" fill-opacity=".45">WORKERS</text>

    <text x="40" y="356" font-size="10" letter-spacing=".1em" fill="#efe6d6" fill-opacity=".45">V7.5 · 27 HOOKS · 30 RULES · OPUS 5.5 + SONNET 5.5</text>
  </g>

  <!-- dispatch out (solid), one line back (dashed) -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#efe6d6" stroke-opacity=".35">
      <path d="M232 110H276M271 106l5 4-5 4"/>
      <path d="M232 170H276M271 166l5 4-5 4"/>
      <path d="M232 230H276M271 226l5 4-5 4"/>
    </g>
    <g stroke="#5fb3a1">
      <path d="M276 126H234" stroke-dasharray="3 4"/><path d="M239 122l-5 4 5 4"/>
      <path d="M276 186H234" stroke-dasharray="3 4"/><path d="M239 182l-5 4 5 4"/>
      <path d="M276 246H234" stroke-dasharray="3 4"/><path d="M239 242l-5 4 5 4"/>
    </g>
    <g stroke="#efe6d6" stroke-opacity=".2" stroke-width="1.2">
      <path d="M442 118H470"/><path d="M442 178H470"/><path d="M442 238H470"/>
    </g>
  </g>

  <!-- workers -->
  <g stroke-width="1.5" stroke-linecap="round">
    <circle cx="482" cy="118" r="8" fill="#14110c" stroke="#7fc49a"/><path d="M478 118l3 3 5-6" fill="none" stroke="#7fc49a"/>
    <circle cx="512" cy="118" r="8" fill="#14110c" stroke="#7fc49a"/><path d="M508 118l3 3 5-6" fill="none" stroke="#7fc49a"/>
    <circle cx="482" cy="178" r="8" fill="#14110c" stroke="#7fc49a"/><path d="M478 178l3 3 5-6" fill="none" stroke="#7fc49a"/>
    <circle cx="512" cy="178" r="8" fill="#5fb3a1" fill-opacity=".25" stroke="#5fb3a1"/>
    <circle cx="542" cy="178" r="8" fill="#14110c" stroke="#efe6d6" stroke-opacity=".35"/>
    <circle cx="482" cy="238" r="8" fill="#14110c" stroke="#efe6d6" stroke-opacity=".35"/>
  </g>
</svg>
