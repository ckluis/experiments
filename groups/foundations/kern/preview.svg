<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="kern — a tiny Lisp kernel evaluates application code that lives as versioned rows in Postgres: views, workflows, policies and even an agent-written patch">
