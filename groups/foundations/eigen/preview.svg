<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="eigen — the same Rust binary runs as server and as an offline native app with a local replica that syncs to Postgres when reconnected, with PII hidden while offline">
  <defs>
    <radialGradient id="glow" cx="12%" cy="10%" r="70%">
      <stop offset="0" stop-color="#9b86e8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9b86e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#efe6d6" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#14110c"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="104" width="236" height="196" rx="14" fill="#1c1812" fill-opacity="1" stroke="#efe6d6" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="56" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start" >--MODE=NATIVE</text>
<rect x="56" y="142" width="204" height="60" rx="10" fill="#9b86e8" fill-opacity="0.12" stroke="#9b86e8" stroke-opacity="1" stroke-width="1.5"/>
<text x="158" y="168" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.1em" fill="#9b86e8" fill-opacity="1" text-anchor="middle" >./APP</text>
<text x="158" y="188" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.04em" fill="#efe6d6" fill-opacity="0.6" text-anchor="middle" >renders locally</text>
<rect x="56" y="214" width="204" height="32" rx="8" fill="#1c1812" fill-opacity="1" stroke="#efe6d6" stroke-opacity="0.22" stroke-width="1.5"/>
<text x="72" y="235" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.08em" fill="#efe6d6" fill-opacity="0.6" text-anchor="start" >SQLITE REPLICA</text>
<text x="56" y="272" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.06em" fill="#efe6d6" fill-opacity="0.45" text-anchor="start" >NAME</text>
<rect x="104" y="261" width="60" height="14" rx="3" fill="#efe6d6" fill-opacity="0.18" stroke="none" stroke-opacity="0" stroke-width="0"/>
<text x="56" y="290" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.06em" fill="#efe6d6" fill-opacity="0.45" text-anchor="start" >SSN</text>
<rect x="104" y="279" width="60" height="14" rx="3" fill="none" fill-opacity="1" stroke="#9b86e8" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="174" y="290" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.06em" fill="#9b86e8" fill-opacity="1" text-anchor="start" >HIDDEN OFFLINE</text>
<rect x="364" y="104" width="236" height="196" rx="14" fill="#1c1812" fill-opacity="1" stroke="#efe6d6" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="380" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.1em" fill="#efe6d6" fill-opacity="0.5" text-anchor="start" >--MODE=SERVER</text>
<rect x="380" y="142" width="204" height="60" rx="10" fill="#9b86e8" fill-opacity="0.12" stroke="#9b86e8" stroke-opacity="1" stroke-width="1.5"/>
<text x="482" y="168" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.1em" fill="#9b86e8" fill-opacity="1" text-anchor="middle" >./APP</text>
<text x="482" y="188" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.04em" fill="#efe6d6" fill-opacity="0.6" text-anchor="middle" >same binary</text>
<rect x="380" y="214" width="204" height="64" rx="8" fill="#1c1812" fill-opacity="1" stroke="#efe6d6" stroke-opacity="0.22" stroke-width="1.5"/>
<text x="482" y="243" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.1em" fill="#efe6d6" fill-opacity="0.85" text-anchor="middle" >POSTGRES</text>
<text x="482" y="262" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.04em" fill="#efe6d6" fill-opacity="0.45" text-anchor="middle" >the only stateful thing</text>
<path d="M276 214 H364" fill="none" stroke="#9b86e8" stroke-opacity="1" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M358 209 L364 214 L358 219" fill="none" stroke="#9b86e8" stroke-opacity="1" stroke-width="1.5"/>
<path d="M282 209 L276 214 L282 219" fill="none" stroke="#9b86e8" stroke-opacity="1" stroke-width="1.5"/>
<text x="320" y="202" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.1em" fill="#9b86e8" fill-opacity="1" text-anchor="middle" >SYNC</text>
<text x="320" y="236" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.04em" fill="#efe6d6" fill-opacity="0.45" text-anchor="middle" >on reconnect</text>
<text x="40" y="340" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.1em" fill="#efe6d6" fill-opacity="0.45" text-anchor="start" >ONE STATIC BINARY · WEB, DESKTOP, PHONE, API</text>
  </g>
  <text x="40" y="58" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="26" fill="#efe6d6">One binary, one Postgres.</text>
</svg>
