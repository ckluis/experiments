<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wijzer — multi-mode widget</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:364px;height:382px}
  body{margin:0;overflow:hidden;background:#e9e6df;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
  #w{
    width:364px;height:382px;border-radius:26px;overflow:hidden;position:relative;
    background:#e9e6df;touch-action:pan-y;cursor:grab;
  }
  #w.drag{cursor:grabbing}
  #rail{
    display:flex;width:1092px;height:382px;
    transform:translateX(0);
    transition:transform .38s cubic-bezier(.25,.7,.25,1);
    will-change:transform;
  }
  @media (prefers-reduced-motion:reduce){#rail{transition:none}}
  #rail iframe{width:364px;height:382px;flex:0 0 364px;border:0;display:block;background:transparent}
  /* transparent layer that owns the swipe; panes are static so nothing is lost */
  #touch{position:absolute;inset:0;z-index:2}
  #dots{
    position:absolute;left:0;right:0;bottom:6px;z-index:3;
    display:flex;justify-content:center;gap:6px;
  }
  #dots i{width:4.5px;height:4.5px;border-radius:50%;background:rgba(90,86,78,.35);
    cursor:pointer;transition:background .2s;box-shadow:0 0 0 2px rgba(250,249,246,.25)}
  #dots i.on{background:#55524b}
</style>
</head>
<body>
<div id="w" aria-label="wijzer multi-mode widget: swipe between the instrument dial, the coastal outdoor mode, and the work schedule">
  <div id="rail">
    <iframe src="01e-instrument.html" title="Mode 1 — the combined dial" scrolling="no"></iframe>
    <iframe src="outdoor.html" title="Mode 2 — outdoor" scrolling="no"></iframe>
    <iframe src="work.html" title="Mode 3 — work" scrolling="no"></iframe>
  </div>
  <div id="touch"></div>
  <div id="dots"><i class="on"></i><i></i><i></i></div>
</div>

<script>
(function(){
  'use strict';
  var w=document.getElementById('w'),
      rail=document.getElementById('rail'),
      touch=document.getElementById('touch'),
      dots=Array.prototype.slice.call(document.querySelectorAll('#dots i'));
  var idx=0, startX=null, dx=0, active=false;

  function go(i){
    idx=Math.max(0,Math.min(2,i));
    rail.style.transform='translateX('+(-idx*364)+'px)';
    dots.forEach(function(d,j){d.className=(j===idx)?'on':'';});
  }
  dots.forEach(function(d,j){d.addEventListener('click',function(e){e.stopPropagation();go(j);});});

  touch.addEventListener('pointerdown',function(e){
    active=true; startX=e.clientX; dx=0;
    rail.style.transition='none';
    w.classList.add('drag');
    touch.setPointerCapture(e.pointerId);
  });
  touch.addEventListener('pointermove',function(e){
    if(!active)return;
    dx=e.clientX-startX;
    var base=-idx*364, x=base+dx;
    if((idx===0&&dx>0)||(idx===2&&dx<0)) x=base+dx/3;   /* rubber band */
    rail.style.transform='translateX('+x+'px)';
  });
  function release(){
    if(!active)return;
    active=false;
    rail.style.transition='';
    w.classList.remove('drag');
    if(dx<-60) go(idx+1);
    else if(dx>60) go(idx-1);
    else go(idx);
  }
  touch.addEventListener('pointerup',release);
  touch.addEventListener('pointercancel',release);
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(idx+1);
    if(e.key==='ArrowLeft')go(idx-1);
  });
})();
</script>
</body>
</html>
