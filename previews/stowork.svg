<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="STOWORK — a carry-on that unfolds into a three-monitor workstation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a140c"/><stop offset="1" stop-color="#0e0a05"/>
    </linearGradient>
    <radialGradient id="glowP" cx="16%" cy="8%" r="60%">
      <stop offset="0" stop-color="#6b4ec2" stop-opacity=".34"/><stop offset="1" stop-color="#6b4ec2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="92%" cy="100%" r="65%">
      <stop offset="0" stop-color="#e6a15c" stop-opacity=".26"/><stop offset="1" stop-color="#e6a15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048"/><stop offset="1" stop-color="#20242b"/>
    </linearGradient>
    <linearGradient id="aluLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cdd2"/><stop offset="1" stop-color="#8b9097"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123047"/><stop offset="0.5" stop-color="#0e2233"/><stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="screenWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2739"/><stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6d8f" stop-opacity=".55"/><stop offset="1" stop-color="#123047" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowScreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#glowP)"/>
  <rect width="1200" height="760" fill="url(#glowA)"/>

  <!-- soft floor reflection -->
  <ellipse cx="600" cy="662" rx="360" ry="42" fill="#000" opacity="0.45" filter="url(#soft)"/>

  <!-- screen glow halo -->
  <rect x="360" y="210" width="480" height="300" rx="20" fill="#2f6d8f" opacity="0.22" filter="url(#glowScreen)"/>

  <!-- ===== LEFT WING ===== angled back-left -->
  <g>
    <polygon points="356,250 470,286 470,556 356,540" fill="#14181d" stroke="#3a4048" stroke-width="2"/>
    <polygon points="366,262 462,294 462,548 366,532" fill="url(#screenWing)"/>
    <polygon points="366,262 462,294 462,420 366,392" fill="url(#wall)" opacity="0.7"/>
    <line x1="374" y1="300" x2="452" y2="326" stroke="#2f6d8f" stroke-width="3" opacity="0.5"/>
    <line x1="374" y1="330" x2="430" y2="348" stroke="#3a5c73" stroke-width="3" opacity="0.4"/>
    <line x1="374" y1="356" x2="444" y2="380" stroke="#3a5c73" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- ===== RIGHT WING ===== angled back-right -->
  <g>
    <polygon points="844,250 730,286 730,556 844,540" fill="#14181d" stroke="#3a4048" stroke-width="2"/>
    <polygon points="834,262 738,294 738,548 834,532" fill="url(#screenWing)"/>
    <polygon points="834,262 738,294 738,430 834,398" fill="url(#wall)" opacity="0.55"/>
    <rect x="756" y="300" width="64" height="44" rx="4" fill="#0e2233" stroke="#2f6d8f" stroke-width="1.5" opacity="0.6"/>
    <rect x="756" y="356" width="64" height="30" rx="4" fill="#0e2233" stroke="#3a5c73" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- ===== CENTER MONITOR ===== -->
  <g>
    <rect x="462" y="238" width="276" height="292" rx="12" fill="#0c0e11" stroke="#3a4048" stroke-width="2.5"/>
    <rect x="474" y="250" width="252" height="268" rx="6" fill="url(#screen)"/>
    <!-- wallpaper wash -->
    <rect x="474" y="250" width="252" height="268" rx="6" fill="url(#wall)" opacity="0.8"/>
    <!-- menu bar -->
    <rect x="474" y="250" width="252" height="18" fill="#0a141d" opacity="0.85"/>
    <circle cx="486" cy="259" r="3" fill="#e6a15c"/><circle cx="497" cy="259" r="3" fill="#6ee0a0"/><circle cx="508" cy="259" r="3" fill="#5aa9d6"/>
    <!-- editor window -->
    <rect x="488" y="286" width="128" height="150" rx="6" fill="#0b1a26" stroke="#204055" stroke-width="1.5"/>
    <line x1="500" y1="306" x2="560" y2="306" stroke="#4f8fb0" stroke-width="3"/>
    <line x1="500" y1="320" x2="596" y2="320" stroke="#356b86" stroke-width="3"/>
    <line x1="512" y1="334" x2="588" y2="334" stroke="#2b566c" stroke-width="3"/>
    <line x1="512" y1="348" x2="566" y2="348" stroke="#356b86" stroke-width="3"/>
    <line x1="500" y1="362" x2="580" y2="362" stroke="#2b566c" stroke-width="3"/>
    <line x1="512" y1="376" x2="548" y2="376" stroke="#e6a15c" stroke-width="3" opacity="0.8"/>
    <line x1="500" y1="404" x2="592" y2="404" stroke="#25455a" stroke-width="3"/>
    <line x1="500" y1="418" x2="572" y2="418" stroke="#25455a" stroke-width="3"/>
    <!-- chart window -->
    <rect x="628" y="286" width="86" height="150" rx="6" fill="#0b1a26" stroke="#204055" stroke-width="1.5"/>
    <rect x="640" y="404" width="10" height="20" fill="#2f6d8f"/><rect x="656" y="392" width="10" height="32" fill="#3f88ab"/>
    <rect x="672" y="376" width="10" height="48" fill="#5aa9d6"/><rect x="688" y="360" width="10" height="64" fill="#e6a15c"/>
    <polyline points="640,336 656,326 672,332 688,312 700,318" fill="none" stroke="#6ee0a0" stroke-width="2.5"/>
    <!-- camera dot -->
    <circle cx="600" cy="246" r="2.4" fill="#1a2a36"/>
  </g>

  <!-- ===== AV BOOM (mic + camera) ===== -->
  <g stroke="#4a5058" stroke-width="4" stroke-linecap="round">
    <line x1="600" y1="238" x2="600" y2="172"/>
    <line x1="600" y1="172" x2="566" y2="150"/>
  </g>
  <circle cx="560" cy="146" r="11" fill="#1b1d20" stroke="#3a4048" stroke-width="2"/>
  <circle cx="560" cy="146" r="4" fill="#0a0c0e"/>
  <rect x="612" y="160" width="26" height="18" rx="4" fill="#20242b" stroke="#3a4048" stroke-width="1.5"/>
  <circle cx="625" cy="169" r="4.5" fill="#0a0c0e" stroke="#5aa9d6" stroke-width="1.2"/>

  <!-- ===== CASE BASE ===== the carry-on body / desk -->
  <g>
    <!-- top surface -->
    <polygon points="360,556 840,556 892,612 308,612" fill="url(#alu)"/>
    <!-- front face -->
    <rect x="308" y="612" width="584" height="46" rx="8" fill="#20242b"/>
    <rect x="308" y="612" width="584" height="46" rx="8" fill="url(#alu)" opacity="0.5"/>
    <!-- amber accent seam -->
    <rect x="308" y="609" width="584" height="4" rx="2" fill="#e6a15c" opacity="0.9"/>
    <!-- feet -->
    <rect x="330" y="656" width="30" height="8" rx="3" fill="#0c0e11"/>
    <rect x="840" y="656" width="30" height="8" rx="3" fill="#0c0e11"/>
  </g>

  <!-- ===== KEYBOARD ===== on the top surface -->
  <g fill="#2a2e35" stroke="#43494f" stroke-width="1">
    <g transform="translate(452,566)">
      <!-- 5 rows x 12 keys, slight perspective via decreasing width handled by scale -->
      <g>
        <rect x="0" y="0" width="16" height="9" rx="2"/><rect x="19" y="0" width="16" height="9" rx="2"/><rect x="38" y="0" width="16" height="9" rx="2"/><rect x="57" y="0" width="16" height="9" rx="2"/><rect x="76" y="0" width="16" height="9" rx="2"/><rect x="95" y="0" width="16" height="9" rx="2"/><rect x="114" y="0" width="16" height="9" rx="2"/><rect x="133" y="0" width="16" height="9" rx="2"/><rect x="152" y="0" width="16" height="9" rx="2"/><rect x="171" y="0" width="16" height="9" rx="2"/><rect x="190" y="0" width="16" height="9" rx="2"/><rect x="209" y="0" width="16" height="9" rx="2"/>
      </g>
      <g transform="translate(3,13)">
        <rect x="0" y="0" width="16" height="9" rx="2"/><rect x="19" y="0" width="16" height="9" rx="2"/><rect x="38" y="0" width="16" height="9" rx="2"/><rect x="57" y="0" width="16" height="9" rx="2"/><rect x="76" y="0" width="16" height="9" rx="2"/><rect x="95" y="0" width="16" height="9" rx="2"/><rect x="114" y="0" width="16" height="9" rx="2"/><rect x="133" y="0" width="16" height="9" rx="2"/><rect x="152" y="0" width="16" height="9" rx="2"/><rect x="171" y="0" width="16" height="9" rx="2"/><rect x="190" y="0" width="16" height="9" rx="2"/><rect x="209" y="0" width="14" height="9" rx="2"/>
      </g>
      <g transform="translate(6,26)">
        <rect x="0" y="0" width="16" height="9" rx="2"/><rect x="19" y="0" width="16" height="9" rx="2"/><rect x="38" y="0" width="16" height="9" rx="2"/><rect x="57" y="0" width="16" height="9" rx="2"/><rect x="76" y="0" width="16" height="9" rx="2"/><rect x="95" y="0" width="16" height="9" rx="2"/><rect x="114" y="0" width="16" height="9" rx="2"/><rect x="133" y="0" width="16" height="9" rx="2"/><rect x="152" y="0" width="16" height="9" rx="2"/><rect x="171" y="0" width="16" height="9" rx="2"/><rect x="190" y="0" width="26" height="9" rx="2"/>
      </g>
      <g transform="translate(9,39)">
        <rect x="0" y="0" width="26" height="9" rx="2"/><rect x="29" y="0" width="16" height="9" rx="2"/><rect x="48" y="0" width="16" height="9" rx="2"/><rect x="67" y="0" width="16" height="9" rx="2"/><rect x="86" y="0" width="60" height="9" rx="2"/><rect x="149" y="0" width="16" height="9" rx="2"/><rect x="168" y="0" width="16" height="9" rx="2"/><rect x="187" y="0" width="16" height="9" rx="2"/>
      </g>
    </g>
    <!-- trackpad -->
    <rect x="690" y="566" width="72" height="48" rx="6" fill="#171b20" stroke="#43494f" stroke-width="1.2"/>
    <rect x="694" y="570" width="64" height="40" rx="4" fill="#1d222a" opacity="0.7"/>
  </g>

  <!-- ===== COMPUTE BAY (mini computer in a printed cradle) ===== left-front of base -->
  <g>
    <!-- printed cradle -->
    <rect x="322" y="576" width="96" height="52" rx="7" fill="#6c6f74"/>
    <g stroke="#5a5d61" stroke-width="1.4" opacity="0.7">
      <line x1="324" y1="584" x2="416" y2="584"/><line x1="324" y1="592" x2="416" y2="592"/><line x1="324" y1="600" x2="416" y2="600"/><line x1="324" y1="608" x2="416" y2="608"/><line x1="324" y1="616" x2="416" y2="616"/>
    </g>
    <!-- mini computer -->
    <rect x="332" y="566" width="76" height="34" rx="7" fill="url(#aluLight)" stroke="#7c8087" stroke-width="1"/>
    <circle cx="370" cy="576" r="8" fill="#b9bec4"/>
    <circle cx="399" cy="595" r="2.4" fill="#6ee0a0"/>
    <!-- amber quarter-turn latch -->
    <circle cx="410" cy="602" r="4" fill="#e6a15c"/>
  </g>
</svg>
