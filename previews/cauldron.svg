<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="cauldron — one sealed slab, the single binary, subdivided into a tidy grid of twenty slate module tiles (http, ws, db, crypto, scry, grimoire, alembic, reagent, forge, agent, llm and the rest) with http glowing as the entry point; a faint pair of Lisp parentheses brackets the slab; ghosted outside dependencies — a quicklisp package, a .so chip, an npm cloud, a docker container — have their dashed lines stop dead at the sealed wall with a struck-through mark at each; a faint ARCHIVED MAR 2026 stamp sits on the top-right corner; below, a row of green test ticks fades out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a140c"/><stop offset="1" stop-color="#0e0a05"/>
    </linearGradient>
    <radialGradient id="glowP" cx="16%" cy="8%" r="60%">
      <stop offset="0" stop-color="#6b4ec2" stop-opacity=".34"/><stop offset="1" stop-color="#6b4ec2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="92%" cy="100%" r="65%">
      <stop offset="0" stop-color="#e6a15c" stop-opacity=".22"/><stop offset="1" stop-color="#e6a15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f26"/><stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c313a"/><stop offset="1" stop-color="#21252d"/>
    </linearGradient>
    <linearGradient id="tickFade" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="980" y2="0">
      <stop offset="0" stop-color="#6ee0a0" stop-opacity=".9"/><stop offset=".55" stop-color="#6ee0a0" stop-opacity=".45"/><stop offset="1" stop-color="#6ee0a0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#f2e9da" fill-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="wide" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="wall" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#glowP)"/>
  <rect width="1200" height="760" fill="url(#glowA)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>

  <!-- ===== the Lisp parens bracketing the whole thing ===== -->
  <g font-family="Fraunces, Georgia, serif" font-size="380" font-weight="300" fill="#e6dcff" fill-opacity=".11">
    <text x="184" y="322">(</text>
    <text x="1016" y="322" text-anchor="end">)</text>
  </g>

  <!-- ===== outside: the dependencies that never get in ===== -->
  <g stroke="#cfc8bb" stroke-opacity=".4" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- package box (quicklisp) -->
    <g transform="translate(150,150)">
      <path d="M0 -34 L36 -17 L36 21 L0 38 L-36 21 L-36 -17 Z"/>
      <path d="M-36 -17 L0 0 L36 -17 M0 0 L0 38"/>
      <path d="M-18 -26 L18 -8" stroke-dasharray="3 3"/>
    </g>
    <!-- shared-object chip (.so / ffi) -->
    <g transform="translate(150,272)">
      <rect x="-34" y="-20" width="68" height="40" rx="4"/>
      <path d="M-40 -12 H-34 M-40 -4 H-34 M-40 4 H-34 M-40 12 H-34 M34 -12 H40 M34 -4 H40 M34 4 H40 M34 12 H40 M-12 -26 V-20 M0 -26 V-20 M12 -26 V-20 M-12 20 V26 M0 20 V26 M12 20 V26"/>
      <rect x="-14" y="-8" width="28" height="16" rx="2" stroke-opacity=".5"/>
    </g>
    <!-- cloud (npm / cdn) -->
    <g transform="translate(1050,150)">
      <path d="M-30 20 H26 A16 16 0 0 0 28 -12 A22 22 0 0 0 -14 -18 A18 18 0 0 0 -30 20 Z"/>
    </g>
    <!-- container (docker) -->
    <g transform="translate(1050,272)">
      <rect x="-40" y="-18" width="80" height="36" rx="3"/>
      <path d="M-28 -18 V18 M-16 -18 V18 M-4 -18 V18 M8 -18 V18 M20 -18 V18 M32 -18 V18" stroke-opacity=".6"/>
      <path d="M-40 -6 H-46 V6 H-40 M40 -6 H46 V6 H40"/>
    </g>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#cfc8bb" fill-opacity=".58" text-anchor="middle" letter-spacing=".8">
    <text x="150" y="212">quicklisp</text>
    <text x="150" y="322">.so / ffi</text>
    <text x="1050" y="196">npm · cdn</text>
    <text x="1050" y="318">docker</text>
  </g>

  <!-- their lines run to the wall and stop dead -->
  <g stroke="#cfc8bb" stroke-opacity=".42" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round">
    <line x1="196" y1="150" x2="268" y2="150"/>
    <line x1="200" y1="272" x2="268" y2="272"/>
    <line x1="1004" y1="150" x2="932" y2="150"/>
    <line x1="1000" y1="272" x2="932" y2="272"/>
  </g>
  <!-- struck-through marks at the wall -->
  <g fill="#0e0a05" stroke="#f2e9da" stroke-opacity=".78" stroke-width="2.2" stroke-linecap="round">
    <g transform="translate(284,150)"><circle r="10"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(284,272)"><circle r="10"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(916,150)"><circle r="10"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(916,272)"><circle r="10"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
  </g>

  <!-- ===== the sealed slab: one binary ===== -->
  <rect x="300" y="70" width="600" height="280" rx="18" fill="none" stroke="#7b5adc" stroke-opacity=".5" stroke-width="16" filter="url(#wall)"/>
  <rect x="300" y="70" width="600" height="280" rx="18" fill="url(#slab)" stroke="#d9d2c4" stroke-width="5"/>
  <rect x="309" y="79" width="582" height="262" rx="11" fill="none" stroke="#f2e9da" stroke-opacity=".14" stroke-width="1.2"/>

  <!-- entry-point glow behind the http tile -->
  <rect x="772" y="214" width="104" height="52" rx="8" fill="#7b5adc" opacity=".7" filter="url(#wide)"/>

  <!-- 20 module tiles, layered top (cli) to bottom (runtime) -->
  <g fill="url(#tile)" stroke="#f2e9da" stroke-opacity=".14" stroke-width="1">
    <rect x="324" y="94" width="104" height="52" rx="6"/><rect x="436" y="94" width="104" height="52" rx="6"/><rect x="548" y="94" width="104" height="52" rx="6"/><rect x="660" y="94" width="104" height="52" rx="6"/><rect x="772" y="94" width="104" height="52" rx="6"/>
    <rect x="324" y="154" width="104" height="52" rx="6"/><rect x="436" y="154" width="104" height="52" rx="6"/><rect x="548" y="154" width="104" height="52" rx="6"/><rect x="660" y="154" width="104" height="52" rx="6"/><rect x="772" y="154" width="104" height="52" rx="6"/>
    <rect x="324" y="214" width="104" height="52" rx="6"/><rect x="436" y="214" width="104" height="52" rx="6"/><rect x="548" y="214" width="104" height="52" rx="6"/><rect x="660" y="214" width="104" height="52" rx="6"/>
    <rect x="324" y="274" width="104" height="52" rx="6"/><rect x="436" y="274" width="104" height="52" rx="6"/><rect x="548" y="274" width="104" height="52" rx="6"/><rect x="660" y="274" width="104" height="52" rx="6"/><rect x="772" y="274" width="104" height="52" rx="6"/>
  </g>
  <!-- the entry point -->
  <rect x="772" y="214" width="104" height="52" rx="6" fill="#7b5adc" stroke="#e6dcff" stroke-width="2"/>

  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#cfc8bb" fill-opacity=".8" letter-spacing=".2">
    <text x="338" y="125">cli</text><text x="450" y="125">forge</text><text x="562" y="125">scry</text><text x="674" y="125">agent</text><text x="781" y="125" letter-spacing="0">integration</text>
    <text x="338" y="185">ether</text><text x="450" y="185">reagent</text><text x="562" y="185">llm</text><text x="674" y="185">crucible</text><text x="786" y="185">alembic</text>
    <text x="338" y="245">oracle</text><text x="450" y="245">grimoire</text><text x="562" y="245">db</text><text x="674" y="245">ws</text>
    <text x="338" y="305">logging</text><text x="445" y="305" letter-spacing="0">http-client</text><text x="562" y="305">json</text><text x="674" y="305">crypto</text><text x="786" y="305">runtime</text>
  </g>
  <text x="786" y="245" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#e6dcff" letter-spacing=".2">http</text>

  <!-- label plate on the seal -->
  <g transform="translate(326,58)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#0e0a05" stroke="#d9d2c4" stroke-opacity=".6" stroke-width="1.4"/>
    <text x="95" y="16.5" text-anchor="middle" font-size="12.5" fill="#f2e9da" fill-opacity=".82" letter-spacing="1.4">cauldron · one binary</text>
  </g>

  <!-- archived stamp, on the corner -->
  <g transform="translate(866,64) rotate(-7)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
    <rect x="-98" y="-14" width="196" height="28" rx="3" fill="#0e0a05" fill-opacity=".82" stroke="#b8794f" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="0" y="4.5" text-anchor="middle" font-size="12.5" fill="#b8794f" fill-opacity=".85" letter-spacing="2.2">ARCHIVED · MAR 2026</text>
  </g>

  <!-- ===== below the fold ===== -->
  <text x="300" y="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".38" letter-spacing="1.6">1,554 TESTS</text>
  <g fill="none" stroke="url(#tickFade)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 397 l4 4 l8 -9"/><path d="M444 397 l4 4 l8 -9"/><path d="M468 397 l4 4 l8 -9"/><path d="M492 397 l4 4 l8 -9"/><path d="M516 397 l4 4 l8 -9"/><path d="M540 397 l4 4 l8 -9"/><path d="M564 397 l4 4 l8 -9"/><path d="M588 397 l4 4 l8 -9"/><path d="M612 397 l4 4 l8 -9"/><path d="M636 397 l4 4 l8 -9"/><path d="M660 397 l4 4 l8 -9"/><path d="M684 397 l4 4 l8 -9"/><path d="M708 397 l4 4 l8 -9"/><path d="M732 397 l4 4 l8 -9"/><path d="M756 397 l4 4 l8 -9"/><path d="M780 397 l4 4 l8 -9"/><path d="M804 397 l4 4 l8 -9"/><path d="M828 397 l4 4 l8 -9"/><path d="M852 397 l4 4 l8 -9"/><path d="M876 397 l4 4 l8 -9"/><path d="M900 397 l4 4 l8 -9"/><path d="M924 397 l4 4 l8 -9"/><path d="M948 397 l4 4 l8 -9"/>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f2e9da" fill-opacity=".34" letter-spacing="1.6">
    <text x="300" y="440">20 MODULES · 17K LINES · ZERO DEPENDENCIES · NO FFI</text>
    <text x="300" y="480">(save-lisp-and-die "cauldron" :executable t)</text>
  </g>
  <g stroke="#f2e9da" stroke-opacity=".1" stroke-width="1">
    <line x1="300" y1="456" x2="900" y2="456"/><line x1="300" y1="496" x2="900" y2="496"/>
  </g>

  <text x="1160" y="718" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="128" font-weight="600" fill="#f2e9da" fill-opacity=".09" letter-spacing="-3">cauldron</text>
</svg>
