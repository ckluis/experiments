<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#f9f4ea;
  font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.g1{position:absolute;left:-160px;top:-220px;width:760px;height:620px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(107,78,194,.20),transparent 72%);filter:blur(8px)}
.g2{position:absolute;right:-120px;top:-180px;width:620px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(197,106,58,.10),transparent 72%)}
.pad{position:relative;z-index:2;height:100%;padding:62px 68px 56px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px;font-family:"JetBrains Mono",monospace;font-size:13.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#6e6455}
.top b{font-weight:500;color:#1a160f}
.top .rule{flex:1;height:1px;background:#ddd3c1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-family:"Fraunces",Georgia,serif;font-size:62px;line-height:1.06;letter-spacing:-.018em;
  font-weight:400;color:#7d7263}
h1 em{display:block;font-style:italic;font-weight:700;color:#1a160f;margin-top:4px}
.hr{height:1px;background:#ddd3c1;margin:0 0 26px}
.bot{display:flex;align-items:flex-end;justify-content:space-between}
.stats{display:flex;gap:58px}
.s .n{font-family:"Fraunces",Georgia,serif;font-size:40px;font-weight:700;color:#1a160f;line-height:1;letter-spacing:-.01em}
.s .l{margin-top:9px;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#6e6455}
.url{font-family:"JetBrains Mono",monospace;font-size:14px;color:#6e6455;letter-spacing:.01em}
</style></head><body>
<div class="g1"></div><div class="g2"></div>
<div class="pad">
  <div class="top"><b>ckluis</b> <span>/ experiments</span><span class="rule"></span><span>A field of experiments &middot; 2026</span></div>
  <div class="mid">
    <h1>Experiments used to be expensive.<em>Now they cost a weekend.</em></h1>
  </div>
  <div>
    <div class="hr"></div>
    <div class="bot">
      <div class="stats">
        <div class="s"><div class="n">21</div><div class="l">Experiments</div></div>
        <div class="s"><div class="n">8</div><div class="l">Shipped</div></div>
        <div class="s"><div class="n">6</div><div class="l">Themes</div></div>
      </div>
      <div class="url">ckluis.github.io/experiments</div>
    </div>
  </div>
</div></body></html>
